<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brightpan support agent: architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #eef1f4; --line: #c9d1da; --ink: #1e2329; --muted: #5a6573;
    --enamel: #2457c5; --enamel-soft: #e4ebf8; --amber: #e0a03a; --amber-soft: #fbf1df;
    --green: #2f7d5b; --green-soft: #e5f2ec;
  }
  html, body { margin: 0; background: var(--steel); }
  svg { display: block; }
  .t  { font-family: Outfit, system-ui, sans-serif; font-weight: 700; fill: var(--ink); }
  .h  { font-family: Outfit, system-ui, sans-serif; font-weight: 600; fill: var(--ink); font-size: 19px; }
  .b  { font-family: Archivo, system-ui, sans-serif; fill: var(--muted); font-size: 14.5px; }
  .bi { font-family: Archivo, system-ui, sans-serif; fill: var(--ink); font-size: 14.5px; }
  .s  { font-family: Archivo, system-ui, sans-serif; fill: var(--muted); font-size: 13px; }
  .w  { fill: #ffffff; }
  .wm { fill: #d5e0f6; }
  .lab { font-family: Archivo, system-ui, sans-serif; font-size: 13px; fill: var(--enamel); font-weight: 500; }
  .card { fill: #ffffff; stroke: var(--line); stroke-width: 1.2; }
  .chip { fill: #ffffff; stroke: var(--line); stroke-width: 1.2; }
  .arrow { stroke: var(--enamel); stroke-width: 2; fill: none; marker-end: url(#a); }
  .arrow-muted { stroke: #8a96a6; stroke-width: 1.6; fill: none; marker-end: url(#am); stroke-dasharray: 5 5; }
  .arrow-amber { stroke: var(--amber); stroke-width: 2; fill: none; marker-end: url(#aa); }
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"
     aria-labelledby="title desc">
  <title id="title">Brightpan support agent architecture</title>
  <desc id="desc">A customer asks in the Next.js chat app, whose server route forwards the message to an n8n webhook.
    An AI agent (Claude Opus 5.5 or GPT-5.5) answers using three tools: help-center search over Supabase pgvector,
    an order lookup in Shopify that only returns details when the order number and email match, and a hand-off to
    people via a Supabase handoffs table and Slack. Every turn is logged; failures get an apology and alert the team.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96a6"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a03a"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#eef1f4"/>

  <!-- Title -->
  <g transform="translate(60,62)">
    <circle cx="13" cy="0" r="12" fill="#2457c5"/>
    <circle cx="13" cy="0" r="7.5" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="23" y="-2.5" width="20" height="5" rx="2.5" fill="#2457c5"/>
    <text class="t" x="58" y="11" font-size="32">Brightpan support agent</text>
  </g>
  <text class="b" x="60" y="104" font-size="17">How a customer question becomes a sourced answer, a verified order lookup, or a hand-off to a person.</text>

  <!-- Column 1: who asks -->
  <text class="s" x="60" y="168" font-weight="600" fill="#5a6573" font-size="14">Who asks</text>
  <rect class="card" x="60" y="190" width="220" height="118" rx="14"/>
  <text class="h" x="80" y="226">Customer</text>
  <text class="b" x="80" y="252">Types a question in</text>
  <text class="b" x="80" y="272">the store's chat.</text>

  <rect class="card" x="60" y="560" width="220" height="150" rx="14"/>
  <text class="h" x="80" y="596">Eval harness</text>
  <text class="b" x="80" y="622">40 test questions,</text>
  <text class="b" x="80" y="642">graded automatically,</text>
  <text class="b" x="80" y="662">then reviewed by hand.</text>
  <text class="s" x="80" y="690">eval/run_eval.py</text>

  <!-- Column 2: chat app -->
  <text class="s" x="330" y="168" font-weight="600" font-size="14">Front end</text>
  <rect class="card" x="330" y="190" width="250" height="250" rx="14"/>
  <text class="h" x="350" y="226">Chat app</text>
  <text class="s" x="350" y="248">Next.js + shadcn/ui</text>
  <line x1="350" y1="264" x2="560" y2="264" stroke="#e2e7ed"/>
  <text class="b" x="350" y="290">Server route only accepts</text>
  <text class="b" x="350" y="310">same-origin JSON, rate-limits,</text>
  <text class="b" x="350" y="330">and signs the session id.</text>
  <text class="b" x="350" y="360">The webhook URL and key</text>
  <text class="b" x="350" y="380">never reach the browser.</text>
  <text class="b" x="350" y="410">Shows sources, order card,</text>
  <text class="b" x="350" y="430">hand-off banner and steps.</text>

  <!-- Column 3: n8n -->
  <text class="s" x="630" y="168" font-weight="600" font-size="14">n8n workflow</text>
  <rect x="630" y="190" width="380" height="560" rx="18" fill="#e4ebf8" stroke="#2457c5" stroke-opacity="0.35" stroke-width="1.4"/>

  <rect class="card" x="652" y="212" width="336" height="72" rx="12"/>
  <text class="h" x="672" y="243">Webhook</text>
  <text class="b" x="672" y="267">Rejects requests without the secret key</text>

  <rect x="652" y="314" width="336" height="196" rx="12" fill="#2457c5"/>
  <text class="t w" x="672" y="350" font-size="22">AI agent</text>
  <text class="bi wm" x="672" y="376" style="fill:#d5e0f6">Claude Opus 5.5 or GPT-5.5</text>
  <line x1="672" y1="392" x2="968" y2="392" stroke="#ffffff" stroke-opacity="0.25"/>
  <text class="bi" x="672" y="418" style="fill:#ffffff">System prompt with 9 rules:</text>
  <text class="bi" x="672" y="440" style="fill:#d5e0f6">answer only from tools, cite the source,</text>
  <text class="bi" x="672" y="460" style="fill:#d5e0f6">never guess, escalate refunds and damage.</text>
  <text class="bi" x="672" y="490" style="fill:#d5e0f6">Remembers the last 10 messages.</text>

  <rect x="652" y="540" width="336" height="86" rx="12" fill="#fbf1df" stroke="#e0a03a" stroke-opacity="0.6"/>
  <text class="h" x="672" y="572">If anything fails</text>
  <text class="b" x="672" y="596">Apology reply, error logged,</text>
  <text class="b" x="672" y="614">system-error hand-off for the team.</text>

  <rect class="card" x="652" y="652" width="336" height="76" rx="12"/>
  <text class="h" x="672" y="684">Log every turn</text>
  <text class="b" x="672" y="708">Tools used, cited articles, reply time</text>

  <!-- Column 4: tools -->
  <text class="s" x="1060" y="168" font-weight="600" font-size="14">Tools the agent can call</text>

  <!-- Tool 1 -->
  <rect class="card" x="1060" y="190" width="220" height="150" rx="14"/>
  <text class="h" x="1080" y="224">Search help center</text>
  <text class="b" x="1080" y="250">Finds the article that</text>
  <text class="b" x="1080" y="270">answers the question.</text>
  <text class="lab" x="1080" y="318">Answer must cite it</text>
  <rect class="chip" x="1316" y="198" width="234" height="56" rx="10"/>
  <text class="bi" x="1334" y="222" font-weight="600">OpenAI embeddings</text>
  <text class="s" x="1334" y="242">text-embedding-3-small</text>
  <rect class="chip" x="1316" y="276" width="234" height="56" rx="10"/>
  <text class="bi" x="1334" y="300" font-weight="600">Supabase pgvector</text>
  <text class="s" x="1334" y="320">21 articles, top 4 returned</text>

  <!-- Tool 2 -->
  <rect class="card" x="1060" y="380" width="220" height="150" rx="14"/>
  <text class="h" x="1080" y="414">Look up order</text>
  <text class="b" x="1080" y="440">Status, carrier, tracking</text>
  <text class="b" x="1080" y="460">and dates.</text>
  <rect x="1074" y="482" width="196" height="32" rx="8" fill="#e5f2ec"/>
  <text class="s" x="1084" y="503" style="fill:#2f7d5b;font-weight:600;font-size:12.5px">Only if order # + email match</text>
  <rect class="chip" x="1316" y="388" width="234" height="56" rx="10"/>
  <text class="bi" x="1334" y="412" font-weight="600">Supabase guess limits</text>
  <text class="s" x="1334" y="432">Caps failed lookups, atomically</text>
  <rect class="chip" x="1316" y="466" width="234" height="56" rx="10"/>
  <text class="bi" x="1334" y="490" font-weight="600">Shopify Admin API</text>
  <text class="s" x="1334" y="510">Dev store, 15 orders</text>

  <!-- Tool 3 -->
  <rect class="card" x="1060" y="570" width="220" height="180" rx="14"/>
  <text class="h" x="1080" y="604">Hand off to a person</text>
  <text class="b" x="1080" y="630">Refunds, damaged items,</text>
  <text class="b" x="1080" y="650">warranty, complaints.</text>
  <text class="lab" x="1080" y="704" style="fill:#9a6514">Team replies within</text>
  <text class="lab" x="1080" y="722" style="fill:#9a6514">1 business day</text>
  <rect class="chip" x="1316" y="570" width="234" height="52" rx="10"/>
  <text class="bi" x="1334" y="592" font-weight="600">Shopify email check</text>
  <text class="s" x="1334" y="611">Marks the ticket verified or not</text>
  <rect class="chip" x="1316" y="634" width="234" height="52" rx="10"/>
  <text class="bi" x="1334" y="656" font-weight="600">Supabase handoffs</text>
  <text class="s" x="1334" y="675">Ticket with a summary</text>
  <rect x="1316" y="698" width="234" height="52" rx="10" fill="#fbf1df" stroke="#e0a03a" stroke-opacity="0.7"/>
  <text class="bi" x="1334" y="720" font-weight="600">Slack alert</text>
  <text class="s" x="1334" y="739">#support-escalations</text>

  <!-- Arrows: request path -->
  <path class="arrow" d="M280,249 L322,249"/>
  <path class="arrow" d="M580,236 L644,236"/>
  <text class="lab" x="588" y="226">message</text>
  <path class="arrow" d="M652,404 L590,404"/>
    <path class="arrow" d="M280,635 L605,635 L605,266 L644,266"/>
  <text class="lab" x="300" y="625">same webhook, with the key</text>
  <path class="arrow" d="M820,284 L820,306"/>
  <path class="arrow-amber" d="M820,510 L820,532"/>
  <path class="arrow" d="M840,626 L840,644"/>

  <!-- Agent to tools -->
  <path class="arrow" d="M988,360 C1025,360 1025,265 1052,265"/>
  <path class="arrow" d="M988,412 C1020,412 1025,455 1052,455"/>
  <path class="arrow-amber" d="M988,470 C1030,470 1020,660 1052,660"/>

  <!-- Tools to services -->
  <path class="arrow" d="M1280,226 L1308,226"/>
  <path class="arrow" d="M1433,254 L1433,268"/>
  <path class="arrow" d="M1280,416 L1308,416"/>
  <path class="arrow" d="M1433,444 L1433,458"/>
  <path class="arrow-amber" d="M1280,596 L1308,596"/>
  <path class="arrow-amber" d="M1433,622 L1433,628"/>
  <path class="arrow-amber" d="M1433,686 L1433,692"/>

  <!-- Reply label -->
  <text class="lab" x="612" y="396">reply</text>

  <!-- Bottom: offline ingest and data -->
  <text class="s" x="330" y="806" font-weight="600" font-size="14">Offline data setup</text>
  <rect x="330" y="824" width="1220" height="126" rx="14" fill="#ffffff" stroke="#c9d1da" stroke-dasharray="6 6"/>
  <text class="h" x="352" y="858">Help center ingest</text>
  <text class="b" x="352" y="884">Edit kb/help-center.md, rerun the ingest script.</text>
  <text class="b" x="352" y="904">No workflow change needed.</text>
  <rect class="chip" x="760" y="846" width="170" height="44" rx="10"/>
  <text class="bi" x="778" y="874">help-center.md</text>
  <rect class="chip" x="975" y="846" width="170" height="44" rx="10"/>
  <text class="bi" x="993" y="874">OpenAI embeddings</text>
  <rect class="chip" x="1190" y="846" width="170" height="44" rx="10"/>
  <text class="bi" x="1208" y="874">Supabase kb_chunks</text>
  <path class="arrow-muted" d="M930,868 L967,868"/>
  <path class="arrow-muted" d="M1145,868 L1182,868"/>
  <text class="s" x="760" y="920">One chunk per article, 1,536-dimension vectors, row-level security on every table.</text>
  <path class="arrow-muted" d="M1360,868 L1578,868 L1578,304 L1558,304"/>
  <text class="s" x="1488" y="858">feeds search</text>

  <!-- Legend -->
  <g transform="translate(60,800)">
    <text class="s" x="0" y="6" font-weight="600" font-size="14">Key</text>
    <line x1="0" y1="38" x2="44" y2="38" class="arrow"/>
    <text class="s" x="56" y="42">live request</text>
    <line x1="0" y1="72" x2="44" y2="72" class="arrow-amber"/>
    <text class="s" x="56" y="76">hand-off or failure</text>
    <line x1="0" y1="106" x2="44" y2="106" class="arrow-muted"/>
    <text class="s" x="56" y="110">offline data setup</text>
  </g>
</svg>
</body>
</html>
